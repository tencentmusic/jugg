repositories {
    google()
    mavenCentral()
}
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.22"
    }
}

apply plugin: 'com.android.library'

apply from: "./buildAgentBundle.gradle"

// AGP 7.2.2 NodeUtils.adoptNode() NPEs when the Gradle daemon has mixed DOM
// implementations. Pin the JDK parser before packageReleaseResources.
System.setProperty(
        "javax.xml.parsers.DocumentBuilderFactory",
        "com.sun.org.apache.xerces.internal.jaxp.DocumentBuilderFactoryImpl")
System.setProperty(
        "javax.xml.parsers.SAXParserFactory",
        "com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl")

android {
    compileSdk 33
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DAGENT_VERSION_ARG=$agentVersion"
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "CMakeLists.txt"
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testImplementation 'org.json:json:20231013'
    testImplementation files('libs/dragonfly/dragonfly_0-jugg.jar')
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    compileOnly files('libs/dragonfly/dragonfly_0-jugg.jar')
    compileOnly fileTree(dir: 'framework_class_stub', include: ['*.jar'])
}
