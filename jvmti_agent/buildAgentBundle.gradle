buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
    }
}

import com.android.tools.r8.D8
import com.android.tools.r8.D8Command
import com.android.tools.r8.origin.Origin

import java.nio.file.Files
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

File jarFile = new File(project.projectDir, "build/intermediates/aar_main_jar/release/classes.jar")
List<File> dragonflyAarFiles = [
    new File(project.projectDir, "libs/dragonfly/dragonfly-v0.0.0.S.aar"),
    new File(project.projectDir, "libs/dragonfly/dragonfly-compose-v0.0.0.S.aar")
]
File instrumentsJarFile = new File(project.projectDir, "build/outputs/jugg-instruments.jar")
File mergedRuntimeJarFile = new File(project.projectDir, "build/outputs/jugg-runtime.jar")
File agent64SoFile = new File(project.projectDir, "build/intermediates/library_and_local_jars_jni/release/jni/arm64-v8a/jugg_jvmti_agent.so")
File agent32SoFile = new File(project.projectDir, "build/intermediates/library_and_local_jars_jni/release/jni/armeabi-v7a/jugg_jvmti_agent.so")
File setupScriptFile = new File(project.projectDir, "src/main/script/jugg_agent_setup.sh")
String agentBundlePath = "/deploy/jugg-agent-bundle-${agentVersion}.zip" // must starts with '/' to read resource by plugin
File agentBundleFile = new File(agentBundleDir, agentBundlePath)
String runtimeJarPath = "/deploy/jugg-runtime.jar"
File runtimeJarFile = new File(agentBundleDir, runtimeJarPath)

android {
    defaultConfig {
        buildConfigField("String", "AGENT_VERSION", "\"$agentVersion\"")
        buildConfigField("String", "AGENT_BUNDLE_PATH", "\"$agentBundlePath\"")
        buildConfigField("String", "RUNTIME_JAR_PATH", "\"$runtimeJarPath\"")
        buildConfigField("String", "META_DATA_LABEL_RAW_APPLICATION", "\"com.sickworm.intellij.jugg.hotfix.raw.application\"")
        buildConfigField("String", "INJECT_APPLICATION_NAME", "\"com.sickworm.intellij.jugg.hotfix.BootstrapApplication\"")
        buildConfigField("String", "META_DATA_LABEL_RAW_APP_COMPONENT_FACTORY", "\"com.sickworm.intellij.jugg.hotfix.raw.appComponentFactory\"")
        buildConfigField("String", "INJECT_APP_COMPONENT_FACTORY_NAME", "\"com.sickworm.intellij.jugg.hotfix.BootstrapAppComponentFactory\"")
        buildConfigField("String", "RESOURCE_APK_NAME", "\"resource.ap_\"")
        buildConfigField("String", "AAA_JUGG_FLAG_FILE_PREFIX", "\".jugg_\"") // add AAA_ to control the order in BuildConfig.java
        buildConfigField("String", "JVMTI_AVAILABLE_FLAG_FILE", "AAA_JUGG_FLAG_FILE_PREFIX + \"jvmti_available\"")
        buildConfigField("String", "JVMTI_NOT_AVAILABLE_FLAG_FILE", "AAA_JUGG_FLAG_FILE_PREFIX + \"jvmti_not_available\"")
        buildConfigField("String", "ENABLE_COMPAT_DEPLOY_FLAG_FILE", "AAA_JUGG_FLAG_FILE_PREFIX + \"compat_deploy_enable\"")
    }
}

tasks.register('buildInstrumentJar') {

    inputs.file jarFile
    outputs.file instrumentsJarFile

    doLast {
        if (!jarFile.exists()) {
            throw new IllegalStateException("jarFile $jarFile not exists")
        }

        instrumentsJarFile.parentFile.mkdirs()
        instrumentsJarFile.delete()

        String[] args = "--min-api 26 --output $instrumentsJarFile $jarFile".split(' ')
        D8Command command = D8Command
                .parse(args, Origin.root())
                .build()
        D8.run(command)
    }

    it.dependsOn('assembleRelease')
}

tasks.register('buildRuntimeJar') {

    inputs.files jarFile, dragonflyAarFiles
    outputs.file mergedRuntimeJarFile

    doLast {
        List<File> inputJars = [jarFile]
        dragonflyAarFiles.each { aarFile ->
            if (!aarFile.exists()) {
                throw new IllegalStateException("Dragonfly AAR $aarFile not exists")
            }
            ZipFile aar = new ZipFile(aarFile)
            try {
                ZipEntry classesEntry = aar.getEntry("classes.jar")
                if (classesEntry == null) {
                    throw new IllegalStateException("Dragonfly AAR $aarFile has no classes.jar")
                }
                File extractedJar = new File(temporaryDir, aarFile.name.replace(".aar", ".jar"))
                extractedJar.parentFile.mkdirs()
                aar.getInputStream(classesEntry).withCloseable { input ->
                    extractedJar.withOutputStream { output -> output << input }
                }
                inputJars.add(extractedJar)
            } finally {
                aar.close()
            }
        }

        mergedRuntimeJarFile.parentFile.mkdirs()
        mergedRuntimeJarFile.delete()
        Set<String> writtenEntries = new HashSet<>()
        ZipOutputStream output = new ZipOutputStream(new FileOutputStream(mergedRuntimeJarFile))
        try {
            inputJars.each { inputJar ->
                ZipFile zip = new ZipFile(inputJar)
                try {
                    zip.entries().each { entry ->
                        String name = entry.name
                        boolean signatureEntry = name == "META-INF/MANIFEST.MF"
                            || name.endsWith(".SF")
                            || name.endsWith(".RSA")
                            || name.endsWith(".DSA")
                        if (!entry.directory && !signatureEntry) {
                            if (!writtenEntries.add(name)) {
                                if (!name.startsWith("META-INF/")) {
                                    throw new IllegalStateException("Duplicate runtime entry: $name")
                                }
                            } else {
                                ZipEntry outputEntry = new ZipEntry(name)
                                outputEntry.time = 0L
                                output.putNextEntry(outputEntry)
                                zip.getInputStream(entry).withCloseable { input -> output << input }
                                output.closeEntry()
                            }
                        }
                    }
                } finally {
                    zip.close()
                }
            }
        } finally {
            output.close()
        }

        ZipFile runtimeJar = new ZipFile(mergedRuntimeJarFile)
        try {
            if (runtimeJar.getEntry("top/kokomi/dragonfly/Dragonfly.class") == null) {
                throw new IllegalStateException("Dragonfly classes missing from $mergedRuntimeJarFile")
            }
            if (runtimeJar.getEntry("top/kokomi/dragonfly/compose/ComposeAdapter.class") == null) {
                throw new IllegalStateException("Dragonfly Compose classes missing from $mergedRuntimeJarFile")
            }
        } finally {
            runtimeJar.close()
        }
    }

    it.dependsOn('assembleRelease')
}

tasks.register('buildAgentBundle') {

    inputs.files instrumentsJarFile, agent64SoFile, agent32SoFile, setupScriptFile, mergedRuntimeJarFile
    outputs.dir agentBundleDir

    doLast {
        agentBundleDir.deleteDir()
        agentBundleFile.parentFile.mkdirs()

        ZipOutputStream zipOutputStream = new ZipOutputStream(new FileOutputStream(agentBundleFile))
        [instrumentsJarFile, agent64SoFile, agent32SoFile, setupScriptFile].forEach { file ->
            FileInputStream fileInputStream = new FileInputStream(file)
            if (file == agent32SoFile) {
                ZipEntry zipEntry = new ZipEntry(file.getName().replace(".so", "") + "_alt.so")
                zipOutputStream.putNextEntry(zipEntry)
            } else {
                ZipEntry zipEntry = new ZipEntry(file.getName())
                zipOutputStream.putNextEntry(zipEntry)
            }

            byte[] buffer = new byte[1024]
            int length
            while ((length = fileInputStream.read(buffer)) > 0) {
                zipOutputStream.write(buffer, 0, length)
            }

            zipOutputStream.closeEntry()
            fileInputStream.close()
        }
        zipOutputStream.close()

        runtimeJarFile.delete()
        Files.copy(mergedRuntimeJarFile.toPath(), runtimeJarFile.toPath())
    }

    it.dependsOn('generateDebugBuildConfig') // generate debug BuildConfig to show IDE tint
    it.dependsOn('assembleRelease')
    it.dependsOn('buildInstrumentJar')
    it.dependsOn('buildRuntimeJar')
}
