name: Feature Request
description: Suggest a new Jugg capability or workflow improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: 感谢你的建议。请先描述实际使用场景和当前遇到的问题。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 请描述当前工作流、遇到的问题，以及它带来的影响。
      placeholder: 描述具体使用场景和当前限制。
    validations:
      required: true

  - type: textarea
    id: expected_outcome
    attributes:
      label: 期望结果
      description: 请描述希望获得的用户可观察结果，无需设计内部实现方案。
      placeholder: 描述期望的工作方式或结果。
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 当前替代方案
      description: 如果当前已有绕过方式，请说明具体操作及其成本。
    validations:
      required: false

  - type: dropdown
    id: feature_module
    attributes:
      label: 功能模块
      options:
        - 编译能力
        - 部署能力
        - Android test 能力
        - TX 能力
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: 示例或参考
      description: 可以提供截图、类似产品、示例流程或相关链接。
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可以补充约束、边界或优先级背景。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同功能请求。
          required: true
        - label: 该请求描述了具体使用场景和期望结果。
          required: true
