name: Bug Report
description: Report a Jugg failure or unexpected behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Jugg problem. Please provide the information below to help us reproduce and diagnose it.

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要描述发生了什么，以及问题造成的影响。
      placeholder: 描述实际发生的行为和影响。
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: 问题类型
      options:
        - 编译失败
        - 部署失败
        - 运行时 crash
        - 运行时不生效
        - Android test 功能问题
        - IDE UI 问题
        - CLI/MCP 问题
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为
      description: 请说明你期望 Jugg 如何工作。
      placeholder: 描述预期结果。
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 复现步骤
      description: 请提供最短复现步骤；无法稳定复现时，请说明出现频率和最近一次发生时间。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: report_id
    attributes:
      label: Jugg Report ID（强烈建议）
      description: >-
        Report ID 对应的诊断报告已包含 Jugg、Android Studio、项目环境和相关日志。
        在 Android Studio 中双击 Shift，搜索并选择「Report Jugg Issue」；
        或打开 Jugg Running Panel，点击「Report Issue」。核对待上传的诊断文件并完成上传后，
        复制结果页中的 Report ID。诊断信息可能涉及隐私，是否上传由你决定；不提供 Report ID 也可以提交 Issue。
      placeholder: 例如：1a2b3c4d
    validations:
      required: false

  - type: input
    id: jugg_version
    attributes:
      label: Jugg 版本（未提供 Report ID 时填写）
      description: 已提供 Jugg Report ID 时不需要填写。
      placeholder: 例如：1.2.3
    validations:
      required: false

  - type: input
    id: android_studio_version
    attributes:
      label: Android Studio 版本（未提供 Report ID 时填写）
      description: 已提供 Jugg Report ID 时不需要填写。建议包含版本名称和 build number。
      placeholder: 例如：Android Studio Panda 1 | 2025.3.1
    validations:
      required: false

  - type: textarea
    id: project_environment
    attributes:
      label: 项目环境（未提供 Report ID 时填写）
      description: 已提供 Jugg Report ID 时不需要填写。请提供与问题相关的信息，例如 AGP、Gradle、Kotlin、JDK、操作系统、设备或模拟器、build variant。
      placeholder: |
        AGP：
        Gradle：
        Kotlin：
        JDK：
        操作系统：
        设备或模拟器：
        Build variant：
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（未提供 Report ID 时填写）
      description: 已提供 Jugg Report ID 时不需要填写。请粘贴关键日志或错误堆栈，并删除密钥、用户名、本地路径等敏感信息。
      placeholder: 粘贴关键日志或错误堆栈。
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可以提供截图、录屏、最小示例仓库或其他上下文。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已检查提交内容，并移除不希望公开的敏感信息。
          required: true
