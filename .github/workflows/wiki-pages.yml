name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/wiki/package-lock.json

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: docs/wiki
        run: npm ci

      - name: Build wiki
        working-directory: docs/wiki
        env:
          JUGG_WIKI_BASE: /jugg/
        run: npm run check:homepage

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/wiki/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out repository for IndexNow
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node for IndexNow
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Notify IndexNow of Wiki changes
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node docs/wiki/scripts/submit-indexnow.mjs
