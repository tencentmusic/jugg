apply plugin: 'groovy'

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.21"
    }
}

apply plugin: 'kotlin'
apply plugin: 'kotlin-kapt'

repositories {
    google()
    jcenter()
}


dependencies {
    compileOnly gradleApi()
    compileOnly "com.android.tools.build:gradle:7.2.2"
    compileOnly "com.google.devtools.ksp:symbol-processing-gradle-plugin:1.7.21-1.0.8"
    compileOnly "com.google.devtools.ksp:symbol-processing-api:1.7.21-1.0.8"
    compileOnly "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.21"
    compileOnly "org.jetbrains.kotlin:kotlin-compiler-embeddable:1.7.21"
    compileOnly 'com.squareup.moshi:moshi-kotlin-codegen:1.14.0'
}


