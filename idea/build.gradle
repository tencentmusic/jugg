def thirdPartySourcesDir = rootProject.file('third_party/sources')
def thirdPartySourceChecksumsFile = new File(thirdPartySourcesDir, 'SHA256SUMS')
def generatedThirdPartyDir = new File(buildDir, 'generated/third-party-compliance')
def thirdPartySourceInfoFile = new File(generatedThirdPartyDir, 'SOURCE.md')
def thirdPartyRepositoryUrl = 'https://github.com/tencentmusic/jugg'

def gitHead = {
    def process = ['git', 'rev-parse', 'HEAD'].execute(null, rootDir)
    def output = process.text.trim()
    if (process.waitFor() != 0 || !(output ==~ /[0-9a-f]{40}/)) {
        throw new GradleException('Cannot resolve the Git commit for third-party source references')
    }
    output
}

def sourceChecksums = {
    def checksums = [:]
    thirdPartySourceChecksumsFile.eachLine('UTF-8') { line ->
        def value = line.trim()
        if (value) {
            def parts = value.split(/\s+/, 2)
            if (parts.size() != 2 || !(parts[0] ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("Invalid third-party source checksum line: $line")
            }
            checksums[parts[1]] = parts[0]
        }
    }
    checksums
}

def sha256 = { InputStream input ->
    def digest = MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[8192]
    int read
    while ((read = input.read(buffer)) != -1) {
        digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

def generateThirdPartySourceInfo = tasks.register('generateThirdPartySourceInfo') {
    group = 'build'
    description = 'Generates immutable source locations for redistributed third-party components.'
    inputs.file thirdPartySourceChecksumsFile
    inputs.property 'pluginVersion', provider { version.toString() }
    inputs.property 'sourceRevision', provider { gitHead() }
    outputs.file thirdPartySourceInfoFile
    doLast {
        def revision = gitHead()
        generatedThirdPartyDir.mkdirs()
        thirdPartySourceInfoFile.write("""# Corresponding Source

Jugg plugin version: `${version}`
Source revision: `${revision}`

The complete source tree for this distribution, including `third_party/sources`, is available at:

- Archive: ${thirdPartyRepositoryUrl}/archive/${revision}.tar.gz
- Third-party sources: ${thirdPartyRepositoryUrl}/tree/${revision}/third_party/sources

`SOURCE_SHA256SUMS` records the expected SHA-256 values of the redistributed third-party source files.
""", 'UTF-8')
    }
}

tasks.named('prepareSandbox').configure {
    dependsOn generateThirdPartySourceInfo
    from(rootProject.file('third_party')) {
        into('jugg/third_party')
        exclude('sources/**')
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into('jugg/third_party')
    }
    from(rootProject.file('LICENSE')) {
        into('jugg')
    }
    from(thirdPartySourceInfoFile) {
        into('jugg/third_party')
    }
    from(thirdPartySourceChecksumsFile) {
        into('jugg/third_party')
        rename { 'SOURCE_SHA256SUMS' }
    }
}

def thirdPartySbomPath = 'jugg/third_party/sbom/jugg-third-party.spdx.json'

def verifyThirdPartyCompliance = tasks.register('verifyThirdPartyCompliance') {
    group = 'verification'
    description = 'Verifies third-party notices, source references, licenses, and SBOM in the plugin distribution.'
    doLast {
        def distributions = fileTree("$buildDir/distributions").matching { include '*.zip' }.files
        if (distributions.size() != 1) {
            throw new GradleException("Expected one plugin distribution, found ${distributions.size()}")
        }

        if (System.getenv('CI') == 'true') {
            def sourceStatusProcess = ['git', 'status', '--porcelain', '--untracked-files=all', '--',
                                       'third_party/sources'].execute(null, rootDir)
            def sourceStatus = sourceStatusProcess.text.trim()
            if (sourceStatusProcess.waitFor() != 0) {
                throw new GradleException('Cannot verify the Git status of third-party sources')
            }
            if (sourceStatus) {
                throw new GradleException("Third-party sources must match HEAD before packaging:\n$sourceStatus")
            }
        }

        def checksums = sourceChecksums()
        def sourceFiles = fileTree(thirdPartySourcesDir) {
            include '**/*'
            exclude 'README.md', 'SHA256SUMS'
        }.files.collect {
            thirdPartySourcesDir.toPath().relativize(it.toPath()).toString().replace(File.separator, '/')
        }.sort()
        if (sourceFiles != checksums.keySet().toList().sort()) {
            throw new GradleException('Third-party source files do not match SOURCE_SHA256SUMS')
        }
        checksums.each { path, expectedHash ->
            def sourceFile = new File(thirdPartySourcesDir, path)
            def actualHash = sourceFile.withInputStream { input -> sha256(input) }
            if (actualHash != expectedHash) {
                throw new GradleException("Invalid SHA-256 for third-party source $path: $actualHash")
            }
        }

        def requiredEntries = [
                'jugg/LICENSE',
                'jugg/third_party/README.md',
                'jugg/third_party/INTEGRATION.md',
                'jugg/third_party/SOURCE.md',
                'jugg/third_party/SOURCE_SHA256SUMS',
                'jugg/third_party/THIRD_PARTY_NOTICES.md',
                'jugg/third_party/MODIFICATIONS.md',
                'jugg/third_party/components.csv',
                'jugg/third_party/licenses/Apache-2.0.txt',
                'jugg/third_party/licenses/GPL-2.0-only.txt',
                'jugg/third_party/licenses/GPL-2.0-or-later.txt',
                'jugg/third_party/licenses/GPL-3.0-or-later.txt',
                'jugg/third_party/licenses/LGPL-2.1-or-later.txt',
                'jugg/third_party/licenses/MPL-1.1.txt',
                'jugg/third_party/licenses/CDDL-1.1.txt',
                'jugg/third_party/licenses/GPL-2.0-with-Classpath-exception.html',
                'jugg/third_party/licenses/BSD-2-Clause.txt',
                'jugg/third_party/licenses/BSD-3-Clause.txt',
                'jugg/third_party/licenses/EDL-1.0.html',
                'jugg/third_party/licenses/ISC.txt',
                'jugg/third_party/licenses/JDOM.txt',
                'jugg/third_party/licenses/LLVM-LICENSE.txt',
                'jugg/third_party/licenses/Libpng-2.0.txt',
                'jugg/third_party/licenses/MIT.txt',
                'jugg/third_party/licenses/R8-8.4.21-LICENSE.txt',
                'jugg/third_party/licenses/SAX-PD.txt',
                'jugg/third_party/licenses/SOURCES.md',
                'jugg/third_party/licenses/W3C-19980720.txt',
                'jugg/third_party/licenses/Zlib.txt',
                'jugg/third_party/licenses/kXML2.txt',
                thirdPartySbomPath,
        ]

        def zip = new ZipFile(distributions.first())
        try {
            requiredEntries.each { path ->
                def entry = zip.getEntry(path)
                if (entry == null || entry.size <= 0) {
                    throw new GradleException("Missing third-party compliance file: $path")
                }
            }

            def packagedLicense = zip.getInputStream(zip.getEntry('jugg/LICENSE')).getText('UTF-8')
            if (packagedLicense != rootProject.file('LICENSE').getText('UTF-8')) {
                throw new GradleException('Packaged repository license does not match LICENSE')
            }

            def entries = Collections.list(zip.entries())
            def packagedSources = entries.findAll { it.name.startsWith('jugg/third_party/sources/') }
            if (packagedSources) {
                throw new GradleException("Third-party source payload must not be packaged: ${packagedSources*.name}")
            }

            def packagedChecksums = zip.getInputStream(
                    zip.getEntry('jugg/third_party/SOURCE_SHA256SUMS')).getText('UTF-8')
            if (packagedChecksums != thirdPartySourceChecksumsFile.getText('UTF-8')) {
                throw new GradleException('Packaged third-party source checksums do not match the repository')
            }

            def sourceInfo = zip.getInputStream(zip.getEntry('jugg/third_party/SOURCE.md'))
                    .getText('UTF-8')
            def revision = gitHead()
            if (!sourceInfo.contains("Source revision: `${revision}`") ||
                    !sourceInfo.contains("${thirdPartyRepositoryUrl}/archive/${revision}.tar.gz")) {
                throw new GradleException('Packaged third-party source reference does not match HEAD')
            }

            def thirdPartyCompressedSize = entries.findAll {
                it.name.startsWith('jugg/third_party/')
            }.sum { Math.max(it.compressedSize, 0L) } ?: 0L
            if (thirdPartyCompressedSize > 256 * 1024) {
                throw new GradleException("Packaged third-party compliance data is too large: " +
                        "$thirdPartyCompressedSize bytes")
            }

            def components = zip.getInputStream(zip.getEntry('jugg/third_party/components.csv'))
                    .getText('UTF-8')
            if (components.readLines().size() != 105) {
                throw new GradleException('Third-party component inventory must contain one header and 104 entries')
            }
            ['JavaParser Core,3.17.0,Apache-2.0',
             'juniversalchardet,1.0.3,MPL-1.1',
             'JavaBeans Activation Framework,1.2.0,CDDL-1.1'].each { selectedLicense ->
                if (!components.contains(selectedLicense)) {
                    throw new GradleException("Missing selected license declaration: $selectedLicense")
                }
            }

            def sbom = new JsonSlurper().parseText(zip.getInputStream(
                    zip.getEntry(thirdPartySbomPath))
                    .getText('UTF-8'))
            if (sbom.spdxVersion != 'SPDX-2.3' ||
                    sbom.name != 'Jugg-third-party-components' ||
                    sbom.packages?.size() != 104) {
                throw new GradleException('Invalid SPDX SBOM')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('buildPlugin').configure {
    finalizedBy verifyThirdPartyCompliance
}

