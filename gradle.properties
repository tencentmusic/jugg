kotlin.code.style=official
org.gradle.jvmargs=-Xmx4G -Dkotlin.daemon.jvm.options\="-Xmx4G"
org.gradle.caching=true
# CLI and tests should not keep a daemon. IDEs still start one via Tooling API,
# so also use a short idle timeout.
org.gradle.daemon=false
org.gradle.daemon.idletimeout=10000
org.gradle.parallel=true

# JetBrains Marketplace upload token placeholder. Can be passed via -PintellijPublishToken,
# environment variable ORG_GRADLE_PROJECT_intellijPublishToken, or JETBRAINS_MARKETPLACE_TOKEN.
intellijPublishToken=
