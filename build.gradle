plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '0.6.5'
    id 'org.jetbrains.kotlin.jvm' version '1.4.32'
}

group 'com.sickworm.intellij'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

intellij {
    // Define IntelliJ Platform against which to build the plugin project.
    version '201.8743.12'  // Same IntelliJ IDEA version (2020.11.5) as target 4.1 Android Studio
    type 'IC'              // Use IntelliJ IDEA CE because it's the basis of the IntelliJ Platform
    // Require the Android plugin, Gradle will match the plugin version to intellij.version
    plugins 'android'
}

patchPluginXml.changeNotes = """
      Add change notes here.<br>
      <em>most HTML tags may be used</em>
      """

repositories {
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    testImplementation "junit:junit:4.12"
}

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}