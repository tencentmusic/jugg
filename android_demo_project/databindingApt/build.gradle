apply plugin: 'com.android.library'

// AGP 9 rejects 'org.jetbrains.kotlin.android' because Kotlin support is built in. This fixture only
// contains Java APT sources, so the plugin is kept for older AGP and skipped from AGP 9 on.
def agpMajorVersion = (project.findProperty('agpVersion') ?: '0').toString().tokenize('.')[0] as int
def isKotlinPluginRequired = agpMajorVersion < 9
if (isKotlinPluginRequired) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.example.databindingapt'
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        dataBinding true
    }

    if (isKotlinPluginRequired) {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.2'
}
