//file:noinspection GroovyAssignabilityCheck

import groovy.json.JsonOutput
import java.security.MessageDigest

// Apply Application plugin to enable runnable distribution
apply plugin: 'application'

// Specify the main class for the application
//noinspection GrUnresolvedAccess
application {
    mainClass = 'com.sickworm.intellij.jugg.cmdline.CmdLineKt'
}

def standaloneStartScripts = tasks.register('standaloneStartScripts', CreateStartScripts) {
    applicationName = 'jugg-standalone'
    mainClass.set('com.sickworm.intellij.jugg.cmdline.standalone.JuggDaemonKt')
    outputDir = layout.buildDirectory.dir('standalone-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}

def standaloneBundleStageDir = layout.buildDirectory.dir('standalone-bundle')
def bootstrapProject = project(':standalone_bootstrap')
def sha256 = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

def prepareStandaloneBundle = tasks.register('prepareStandaloneBundle') {
    group = 'distribution'
    description = 'Stages the cross-platform standalone runtime bundle.'
    dependsOn(tasks.named('installDist'), bootstrapProject.tasks.named('jar'))
    inputs.files(configurations.runtimeClasspath)
    inputs.files(bootstrapProject.configurations.runtimeClasspath)
    inputs.dir(new File(rootProject.projectDir, 'docs/skills/jugg-android-dev-loop/scripts'))
    inputs.property('releaseBuildId', rootProject.releaseBuildId)
    inputs.property('runtimeVersion', rootProject.pluginVersion)
    outputs.dir(standaloneBundleStageDir)
    doLast {
        def stageDir = standaloneBundleStageDir.get().asFile
        project.delete(stageDir)
        def jarsDir = new File(stageDir, 'jars')
        jarsDir.mkdirs()
        def bootstrapDir = new File(stageDir, 'bootstrap')
        bootstrapDir.mkdirs()
        def bootstrapFiles = [bootstrapProject.tasks.named('jar').get().archiveFile.get().asFile] +
                bootstrapProject.configurations.runtimeClasspath.files.findAll { it.name.startsWith('gson-') }
        def bootstrapHashes = [:]
        def bootstrapFileNames = bootstrapFiles.collect { source ->
            def targetName = source == bootstrapFiles.first() ? 'standalone-bootstrap.jar' : source.name
            project.copy { from source; into bootstrapDir; rename { targetName } }
            bootstrapHashes[targetName] = sha256(source)
            targetName
        }
        project.copy {
            from new File(rootProject.projectDir, 'docs/skills/jugg-android-dev-loop/scripts')
            into new File(stageDir, 'cli')
        }
        def sourceJars = (new File(installDist.destinationDir, 'lib').listFiles() ?: [])
                .findAll { it.isFile() && it.name.endsWith('.jar') }.sort { it.name }
        def jarHashes = [:]
        def jarFileNames = sourceJars.collect { source ->
            def hash = sha256(source)
            def baseName = source.name.substring(0, source.name.length() - 4)
            def targetName = "${baseName}-${hash}.jar"
            project.copy { from source; into jarsDir; rename { targetName } }
            jarHashes[targetName] = hash
            targetName
        }
        def manifest = [
                schemaVersion      : 1,
                runtimeApiVersion  : 1,
                bootstrapApiVersion: 1,
                targetVersion      : rootProject.pluginVersion,
                releaseBuildId     : rootProject.releaseBuildId,
                releaseChannel     : rootProject.pluginVersion.contains('SNAPSHOT') ? 'snapshot' : 'stable',
                toolingReleaseBuildId: rootProject.releaseBuildId,
                managedBy          : 'external',
                jarFileNames       : jarFileNames,
                jarSha256          : jarHashes,
                bootstrapFileNames : bootstrapFileNames,
                bootstrapSha256    : bootstrapHashes,
        ]
        new File(stageDir, 'standalone_bundle_manifest.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))
        new File(stageDir, 'install.sh').text = '#!/bin/sh\nset -eu\nDIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)\nexec java -cp "$DIR/jars/*" com.sickworm.intellij.jugg.cmdline.standalone.StandaloneBundleInstallerMain "$DIR" "$@"\n'
        new File(stageDir, 'install.command').text = '#!/bin/sh\nset -eu\nexec "$(dirname "$0")/install.sh" "$@"\n'
        new File(stageDir, 'install.cmd').text = '@echo off\r\njava -cp "%~dp0jars\\*" com.sickworm.intellij.jugg.cmdline.standalone.StandaloneBundleInstallerMain "%~dp0" %*\r\n'
    }
}

def standaloneBundle = tasks.register('standaloneBundle', Zip) {
    group = 'distribution'
    description = 'Builds the single cross-platform standalone Jugg bundle.'
    dependsOn(prepareStandaloneBundle)
    archiveFileName.set("jugg-standalone-${rootProject.pluginVersion}.zip")
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    from(standaloneBundleStageDir)
    filesMatching(['install.sh', 'install.command']) { mode = 0755 }
    doFirst {
        project.delete(fileTree(destinationDirectory.get().asFile) { include 'jugg-standalone-*.zip', 'jugg-standalone.zip' })
    }
}

// Ensure the plain jar includes Main-Class for `java -jar` usage
tasks.withType(Jar).configureEach {
    manifest {
        attributes('Main-Class': 'com.sickworm.intellij.jugg.cmdline.CmdLineKt')
    }
}

def demoProjectZipTask = tasks.register('demoProjectZip', Zip) {
    it.group = 'distribution'
    it.description = 'Zip android_demo_project excluding build dirs'
    it.archiveFileName.set('demo_project.zip')
    it.destinationDirectory.set(layout.buildDirectory.dir('demo'))
    def demoProjectDir = file("${rootProject.projectDir}/android_demo_project")
    it.from(demoProjectDir) {
        exclude '**/build/**'
        into 'demo_project'
    }
}

// Customize the distribution:
// - Include debug demo assets under demo/
// - Include release demo assets under demo_release/
// - Add demo_project.zip for both demos so the unpacked distribution can run standalone
extensions.getByName('distributions').getByName('main').contents {
    from(standaloneStartScripts) {
        into('bin')
        fileMode = 0755
    }
    from("${projectDir}/src/demo") {
        into('demo')
    }
    from(demoProjectZipTask.flatMap { it.archiveFile }) {
        into('demo')
    }

    from("${projectDir}/src/demo_release") {
        into('demo_release')
    }
    from(demoProjectZipTask.flatMap { it.archiveFile }) {
        into('demo_release')
    }
}

// Post-process: after distZip completes, clean old unzipped directory and unzip the new archive for quick testing
def unzipDistTask = tasks.register('unzipDistZip') {
    group = 'distribution'
    description = 'Unzip cmd_line.zip to build/distributions, cleaning old directory first'
    dependsOn(tasks.named('distZip'))
    doLast {
        def distDir = layout.buildDirectory.dir('distributions').get().asFile
        def zipFile = new File(distDir, "${project.name}.zip")
        if (!zipFile.exists()) {
            throw new GradleException("Distribution zip not found: ${zipFile}")
        }
        def targetDir = new File(distDir, project.name)
        if (targetDir.exists()) {
            project.delete(targetDir)
        }
        project.copy {
            from project.zipTree(zipFile)
            into distDir
        }
        println("Unzipped ${zipFile.name} to ${targetDir.absolutePath}")
    }
}

// Post-process: open the unzipped distribution root so both demo directories are visible
def openDistRootTask = tasks.register('openDistRootDir') {
    group = 'distribution'
    description = 'Open the root directory of the unzipped distribution'
    dependsOn(unzipDistTask)
    doLast {
        def distDir = layout.buildDirectory.dir('distributions').get().asFile
        def targetDir = new File(distDir, project.name)
        if (!targetDir.exists()) {
            throw new GradleException("Distribution directory not found: ${targetDir}")
        }
        def osName = System.getProperty('os.name').toLowerCase()
        if (osName.contains('mac')) {
            project.exec {
                commandLine 'open', targetDir.absolutePath
            }
        } else if (osName.contains('win')) {
            project.exec {
                commandLine 'cmd', '/c', 'start', targetDir.absolutePath
            }
        } else {
            project.exec {
                commandLine 'xdg-open', targetDir.absolutePath
            }
        }
        println("Opened distribution directory: ${targetDir.absolutePath}")
    }
}

tasks.named('distZip').configure { finalizedBy(unzipDistTask, openDistRootTask) }
tasks.named('test').configure { dependsOn(standaloneBundle) }
// Java compatibility is inherited from the module (11)
