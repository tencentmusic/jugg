plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.jugg.fixture.nativelib'
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.jugg.fixture.nativelib'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
}
