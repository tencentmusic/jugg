plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.jugg.fixture.nativeondemand'
    defaultConfig {
        applicationId 'com.jugg.fixture.nativeondemand'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':nativelib')
}
