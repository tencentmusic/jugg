plugins {
    id 'com.android.library'
}

android {
    compileSdk 35
    namespace 'com.jugg.fixture.nativeondemand.lib'
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 21
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
