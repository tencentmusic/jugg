//file:noinspection ConfigurationAvoidance

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
}

sourceCompatibility = 11
targetCompatibility = 11
version getDirCommitId(rootDir.relativePath(projectDir))

compileKotlin {
    kotlinOptions.jvmTarget = "11"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "11"
}

sourceSets {
    main {
        java {
            srcDirs += agentGeneratedSourceDir
        }
        resources {
            srcDirs += agentBundleDir
        }
    }
}

apply from: './buildReadProjectInfoScript.gradle'

tasks.findByName("processResources").dependsOn("buildReadProjectInfoScript")

// fix: Gradle detected a problem with the following location: 'xxx'. Reason: Task 'xxx' uses this output of task 'xxx'
// without declaring an explicit or implicit dependency. This can lead to incorrect results being produced,
// depending on what order the tasks are executed
tasks.findByName("compileKotlin").dependsOn(":jvmti_agent:generateReleaseBuildConfig")
tasks.findByName("compileJava").dependsOn(":jvmti_agent:generateReleaseBuildConfig")
tasks.findByName("processResources").dependsOn(":jvmti_agent:buildAgentBundle")

repositories {
    google()
    mavenCentral()
    maven { url "https://repo.gradle.org/gradle/libs-releases-local" }

    flatDir {
        dirs 'libs'
    }
}


compileKotlin {
    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs = [
                "-Xskip-metadata-version-check",
        ]
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs = [
                "-Xskip-metadata-version-check",
        ]
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // for Kotlin
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    api "org.jetbrains.kotlin:kotlin-reflect"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-core:1.7.1"

    // for K2JVMCompiler
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable"
    // kotlinx-metadata-jvm:
    // 0.2.0 depends kotlin-stdlib:1.4.10
    // 0.3.0 depends kotlin-stdlib:1.5.0
    // 0.4.2 depends kotlin-stdlib:1.7.0
    // 0.9.0 depends kotlin-stdlib:1.9.0
    implementation "org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0"
    implementation "org.jetbrains.kotlin:kotlin-metadata-jvm:2.2.21"

    // kapt
    // kotlin-annotation-processing will get compile error: org.jetbrains.kotlin.kapt3.Kapt3ComponentRegistrar is not compatible with this version of compiler
    // reason: the argument is com.intellij.mock.MockProject instead of org.jetbrains.kotlin.com.intellij.mock.MockProject
//    implementation "org.jetbrains.kotlin:kotlin-annotation-processing-gradle" // use plugin in project
//    implementation "org.jetbrains.kotlin:kotlin-parcelize-compiler" // use plugin in project

    implementation "io.github.classgraph:classgraph:4.8.110"
    implementation 'com.github.mwiede:jsch:0.2.16'

    // databinding 8.7.3, which use kotlin 1.9.20
    // only for jugg parsing, kapt will use project classpath
    implementation('androidx.databinding:databinding-compiler:8.7.3') {
        // com.intellij.diagnostic.PluginException: Cannot load class com.google.common.util.concurrent.ListenableFuture (
        //  error: loader constraint violation: loader com.intellij.ide.plugins.cl.PluginClassLoader @286323ab wants to load interface com.google.common.util.concurrent.ListenableFuture. A different interface with the same name was previously loaded by com.intellij.util.lang.PathClassLoader @3941a79c. (com.google.common.util.concurrent.ListenableFuture is in unnamed module of loader com.intellij.util.lang.PathClassLoader @3941a79c),
        //  classLoader=PluginClassLoader(plugin=PluginDescriptor(name=Jugg, id=com.sickworm.intellij.jugg, descriptorPath=plugin.xml, path=~/Library/Application Support/Google/AndroidStudio2024.3/plugins/jugg, version=2.2.0-rc27-feature_databinding-SNAPSHOT, package=null, isBundled=false), packagePrefix=null, state=active, parents=PluginDescriptor(name=IDEA CORE, id=com.intellij, moduleName=intellij.platform.vcs.impl, descriptorPath=intellij.platform.vcs.impl.xml, path=/Applications/Android Studio.app/Contents/lib, version=243.24978.46, package=null, isBundled=true), PluginDescriptor(name=IDEA CORE, id=com.intellij, moduleName=intellij.platform.vcs.log.impl, descriptorPath=intellij.platform.vcs.log.impl.xml, path=/Applications/Android Studio.app/Contents/lib, version=243.24978.46, package=null, isBundled=true), PluginDescriptor(name=IDEA CORE, id=com.intellij, moduleName=intellij.platform.vcs.dvcs.impl, descriptorPath=intellij.platform.vcs.dvcs.impl.xml, path=/Applications/Android Studio.app/Contents/lib, version=243.24978.46, package=null, isBundled=true), PluginDescriptor(name=IDEA CORE, id=com.intellij, moduleName=intellij.platform.collaborationTools, descriptorPath=intellij.platform.collaborationTools.xml, path=/Applications/Android Studio.app/Contents/lib, version=243.24978.46, package=null, isBundled=true), PluginDescriptor(name=Android, id=org.jetbrains.android, descriptorPath=plugin.xml, path=/Applications/Android Studio.app/Contents/plugins/android, version=243.24978.46.2431.13208083, package=com.android.tools.idea.gradle.dsl.kotlin, isBundled=true), )
        // use embedded guava in IDEA
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation('androidx.databinding:databinding-compiler-common:8.7.3') {
        exclude group: 'com.google.guava', module: 'guava'
    }
//    implementation('androidx.databinding:databinding-adapters:8.7.3') // it's an aar, should extra and put the jar in libs


    // backend
    implementation "com.squareup.okhttp3:okhttp:4.9.1"

    // other
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.eclipse.jgit:org.eclipse.jgit:6.8.0.202311291450-r"
    // BinaryXmlParser
    implementation "io.github.shiqos:arscblamer:1.2.0"

    // aapt2-inclink executable
    implementation project(':aapt2-inclink')
    // deploy api
    implementation project(':deploy_compat:interface')
    // platform api, split from Idea
    compileOnly project(':platform_compat:base_api')
    compileOnly 'com.android.tools.build:gradle:7.2.2'
//    compileOnly 'org.gradle:gradle-core-api:6.1.1'
    compileOnly gradleApi()

    testImplementation project(':platform_compat:base_api')
    testImplementation "junit:junit:4.12"
    testImplementation "org.mockito:mockito-core:5.4.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.0.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.9.23"
    testImplementation "org.json:json:20230618"

    // java code analysis
    testImplementation "com.github.javaparser:javaparser-symbol-solver-core:3.17.0"
    testImplementation "org.eclipse.jdt:org.eclipse.jdt.core:3.28.0"

    // for debug source code
    // arouter-compiler
//    compileOnly 'com.alibaba:arouter-compiler:1.5.2'
}
