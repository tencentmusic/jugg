//file:noinspection ConfigurationAvoidance

import groovy.json.JsonSlurper

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
}

sourceCompatibility = 11
targetCompatibility = 11
version getDirCommitId(rootDir.relativePath(projectDir))

compileKotlin {
    kotlinOptions.jvmTarget = "11"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "11"
}

sourceSets {
    main {
        java {
            srcDirs += agentGeneratedSourceDir
        }
        resources {
            srcDirs += agentBundleDir
            exclude 'config/servers.json'
        }
    }
}

def internalServersDir = file("$buildDir/generated/internal-resources")

tasks.register('validateInternalServers') {
    doLast {
        def serversFile = file('src/main/resources/config/servers.json')
        if (!serversFile.isFile()) {
            throw new GradleException("Internal plugin build requires ${serversFile}")
        }
        def servers = new JsonSlurper().parse(serversFile)
        if (!(servers instanceof List) || servers.isEmpty()) {
            throw new GradleException("Internal plugin build requires a non-empty servers.json")
        }
    }
}

tasks.register('prepareInternalServers') {
    dependsOn 'validateInternalServers'
    outputs.dir internalServersDir
    doLast {
        delete internalServersDir
        copy {
            from file('src/main/resources/config/servers.json')
            into file("$internalServersDir/config")
        }
    }
}

tasks.named('jar').configure {
    mustRunAfter 'prepareInternalServers'

    def isInternal = provider {
        gradle.taskGraph.allTasks.any { it.name == 'prepareInternalServers' || it.name == 'buildPluginInternal' }
    }
    inputs.property('isInternalBuild', isInternal)

    from(internalServersDir) {
        include 'config/servers.json'
    }

    exclude { details ->
        details.path == 'config/servers.json' && !isInternal.get()
    }
}

apply from: './buildReadProjectInfoScript.gradle'

tasks.findByName("processResources").dependsOn("buildReadProjectInfoScript")

// fix: Gradle detected a problem with the following location: 'xxx'. Reason: Task 'xxx' uses this output of task 'xxx'
// without declaring an explicit or implicit dependency. This can lead to incorrect results being produced,
// depending on what order the tasks are executed
tasks.findByName("compileKotlin").dependsOn(":jvmti_agent:generateReleaseBuildConfig")
tasks.findByName("compileJava").dependsOn(":jvmti_agent:generateReleaseBuildConfig")
tasks.findByName("processResources").dependsOn(":jvmti_agent:buildAgentBundle")

repositories {
    google()
    mavenCentral()
    maven { url "https://repo.gradle.org/gradle/libs-releases-local" }

    flatDir {
        dirs 'libs'
    }
}

configurations {
    kspTestCompiler
    kspTestRuntime1
    kspTestRuntime2
    kspTestProcessorDependencies
    arouterTestProcessors
    arouterTestKotlin
    arouterTestLibraries { transitive = false }
}


compileKotlin {
    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs = [
                "-Xskip-metadata-version-check",
        ]
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs = [
                "-Xskip-metadata-version-check",
        ]
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // for Kotlin
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    api "org.jetbrains.kotlin:kotlin-reflect"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-core:1.7.1"

    // for K2JVMCompiler
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable"
    implementation "org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.10"

    // kapt
    // kotlin-annotation-processing will get compile error: org.jetbrains.kotlin.kapt3.Kapt3ComponentRegistrar is not compatible with this version of compiler
    // reason: the argument is com.intellij.mock.MockProject instead of org.jetbrains.kotlin.com.intellij.mock.MockProject
//    implementation "org.jetbrains.kotlin:kotlin-annotation-processing-gradle" // use plugin in project
//    implementation "org.jetbrains.kotlin:kotlin-parcelize-compiler" // use plugin in project

    implementation "io.github.classgraph:classgraph:4.8.110"
    implementation 'com.github.mwiede:jsch:0.2.16'
    implementation "com.github.javaparser:javaparser-core:3.17.0"
    implementation 'com.android.tools.build.jetifier:jetifier-processor:1.0.0-beta10'

    // databinding 7.4.2 is Java 11 bytecode. 8.7.3 is class file 61.0 and cannot load in
    // Electric Eel / other Java 11 IDEs (XMLParser$ElementContext). kapt still uses project classpath.
    implementation 'androidx.databinding:databinding-compiler:7.4.2'
    implementation 'androidx.databinding:databinding-compiler-common:7.4.2'
    implementation 'com.squareup:javapoet:1.10.0' // fix apt error: Compile DataBinding failed: java.lang.NoClassDefFoundError: com/squareup/javapoet/TypeSpec
//    implementation('androidx.databinding:databinding-adapters:7.4.2') // it's an aar, should extra and put the jar in libs


    // backend
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // other
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.eclipse.jgit:org.eclipse.jgit:6.8.0.202311291450-r"
    // BinaryXmlParser
    implementation("io.github.shiqos:arscblamer:1.2.0") {
        exclude group: 'com.google.guava', module: 'guava'
    }

    // aapt2-inclink executable
    implementation project(':aapt2-inclink')
    // deploy api
    implementation project(':deploy_compat:interface')
    // platform api, split from Idea
    compileOnly project(':platform_compat:base_api')
    compileOnly 'com.android.tools.build:gradle:7.2.2'
//    compileOnly 'org.gradle:gradle-core-api:6.1.1'
    compileOnly gradleApi()

    testImplementation project(':platform_compat:base_api')
    testImplementation gradleApi()
    testImplementation localGroovy()
    testImplementation "junit:junit:4.12"
    testImplementation "org.mockito:mockito-core:5.4.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.0.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.9.23"
    testImplementation "org.json:json:20240303"

    kspTestCompiler 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.1.20'
    kspTestRuntime1 'com.google.devtools.ksp:symbol-processing:2.1.20-1.0.32'
    kspTestRuntime2 'com.google.devtools.ksp:symbol-processing-aa-embeddable:2.1.20-1.0.32'
    kspTestProcessorDependencies 'com.google.devtools.ksp:symbol-processing-api:2.1.20-1.0.32'
    kspTestProcessorDependencies 'com.squareup:kotlinpoet:1.18.1'
    kspTestProcessorDependencies 'com.squareup:kotlinpoet-ksp:1.18.1'
    arouterTestProcessors 'com.alibaba:arouter-compiler:1.5.2'
    arouterTestKotlin 'org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.23'
    arouterTestKotlin 'org.jetbrains.kotlin:kotlin-annotation-processing-embeddable:1.9.23'
    arouterTestLibraries 'com.alibaba:arouter-api:1.5.2@aar'
    arouterTestLibraries 'androidx.fragment:fragment:1.5.4@aar'
    arouterTestLibraries 'com.android.support:support-fragment:28.0.0@aar'
    arouterTestLibraries 'androidx.annotation:annotation:1.5.0'

    // java code analysis
    testImplementation "com.github.javaparser:javaparser-symbol-solver-core:3.17.0"
    testImplementation "org.eclipse.jdt:org.eclipse.jdt.core:3.28.0"

    // for debug source code
    // arouter-compiler
//    compileOnly 'com.alibaba:arouter-compiler:1.5.2'
}

tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/test/assets/arouter-ksp')).withPropertyName('arouterKspFixture')
    inputs.files(configurations.kspTestCompiler, configurations.kspTestRuntime1,
            configurations.kspTestRuntime2, configurations.kspTestProcessorDependencies)
            .withPropertyName('kspTestArtifacts').withNormalizer(ClasspathNormalizer)
    doFirst {
        systemProperty 'ksp.test.compiler', configurations.kspTestCompiler.asPath
        systemProperty 'ksp.test.runtime1', configurations.kspTestRuntime1.asPath
        systemProperty 'ksp.test.runtime2', configurations.kspTestRuntime2.asPath
        systemProperty 'ksp.test.processor.dependencies', configurations.kspTestProcessorDependencies.asPath
        systemProperty 'arouter.test.processors', configurations.arouterTestProcessors.asPath
        systemProperty 'arouter.test.kotlin', configurations.arouterTestKotlin.asPath
        systemProperty 'arouter.test.libraries', configurations.arouterTestLibraries.asPath
    }
    // Forward benchmark system properties to the test JVM.
    [
            "benchmark.project.dir",
            "benchmark.output.dir",
            "benchmark.constref.cache.dir",
            "benchmark.constref.reset.cache",
            "benchmark.constref.timeout.ms",
            "jugg.constref.fullscan.io.throttle.ms",
            "jugg.constref.fullscan.io.throttle.every",
    ].each { key ->
        def value = System.getProperty(key)
        if (value) {
            systemProperty key, value
        }
    }
    // Increase heap to avoid OOM when running multiple Kotlin compiler instances in-process.
    maxHeapSize = "4g"
    // Extra heap for external-project benchmark runs with large source trees.
    if (System.getProperty("benchmark.project.dir")) {
        maxHeapSize = "6g"
    }
}
