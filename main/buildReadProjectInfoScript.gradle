
// collect files
File readProjectInfoKtsFile = new File(projectDir, "src/main/resources/gradle/readProjectInfo.gradle.kts")

List<File> willCollectFiles = new ArrayList<File>()
File scriptDirectory = new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/gradle/script")
for (final def file in scriptDirectory.listFiles()) {
    if (file.name.endsWith(".java") || file.name.endsWith(".kt")) {
        willCollectFiles.add(file)
    }
}
File dataDirectory = new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/project/data")
for (final def file in dataDirectory.listFiles()) {
    if (file.name.endsWith(".java") || file.name.endsWith(".kt")) {
        willCollectFiles.add(file)
    }
}
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/project/JuggPathManager.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/project/dependency/DependencyDiffResult.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/compiler/manifest/XmlAndroidManifestInfo.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/compiler/manifest/XmlParser.kt"))

// sort order
willCollectFiles = willCollectFiles.sort { it.absolutePath }
// order must follow: ProjectInfoSerializerInGradle -> GradleDependencyDiffer -> GradleProjectInfoReaderManager
// or will get:
// java.lang.NoSuchMethodError: 'void ReadProjectInfo_gradle$ProjectInfoSerializerInGradle.<init>(java.io.File)'
// java.lang.NoSuchMethodError: 'void ReadProjectInfo_gradle$GradleDependencyDiffer.<init>(org.gradle.api.Project, ReadProjectInfo_gradle$JuggProjectInfo)'
// ProjectInfoSerializerInGradle constructors:
// public ReadProjectInfo_gradle$ProjectInfoSerializerInGradle(ReadProjectInfo_gradle,java.io.File,boolean)
// public ReadProjectInfo_gradle$ProjectInfoSerializerInGradle(ReadProjectInfo_gradle,java.io.File)
willCollectFiles.remove(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/gradle/script/GradleDependencyDiffer.kt"))
willCollectFiles.remove(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/gradle/script/GradleProjectInfoReaderManager.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/gradle/script/GradleDependencyDiffer.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/gradle/script/GradleProjectInfoReaderManager.kt"))


tasks.register('buildReadProjectInfoScript') {

    inputs.files willCollectFiles
    outputs.file readProjectInfoKtsFile

    doLast {
        readProjectInfoKtsFile.delete()
        readProjectInfoKtsFile.parentFile.mkdirs()

        // start write script
        List<String> classContents = new ArrayList()
        Set<String> imports = new ArrayList()
        willCollectFiles.forEach {
            List<String> lines = it.readLines()
            lines.forEach { String line ->
                if (line.startsWith("import")) {
                    String importClass = line.substring("import".length()).trim()
                    if (!importClass.startsWith("com.sickworm.intellij.jugg") && !importClass.startsWith("org.gradle.api")) {
                        imports.add(importClass)
                    }
                } else if (line.startsWith("package")) {
                    return
                } else if (line.startsWith("@file:Suppress")) {
                    return
                } else {
                    classContents.add(line)
                }
            }
            classContents.add("\n")
        }

        StringBuilder finalContent = new StringBuilder()
        finalContent.append("""// use to read variables in gradle environment
// usage: ./gradlew :app:assembleDebug -I readProjectInfo.gradle
""")
        imports.forEach {
            finalContent.append("import ")
            finalContent.append(it)
            finalContent.append("\n")
        }
        finalContent.append("\n")

        classContents.forEach {
            finalContent.append(it)
            finalContent.append("\n")
        }
        finalContent.append("\n")

        finalContent.append("""
gradle.projectsEvaluated {
    GradleApplicationInjector(rootProject).injectApplication()
}

gradle.buildFinished(object : Action<BuildResult> {
    override fun execute(buildResult: BuildResult) {
        println("Jugg: build finished, isSuccess \${buildResult.failure == null}")
        if (buildResult.failure == null) {
            GradleProjectInfoReaderManager(rootProject).readAndSave()
        }
    }
})
""")
        finalContent.append("\n")

        readProjectInfoKtsFile.write(finalContent.toString())

    }
}
