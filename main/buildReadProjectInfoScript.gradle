import java.util.regex.Matcher
import java.util.regex.Pattern

// collect files
File readProjectInfoKtsFile = new File(projectDir, "src/main/resources/gradle/readProjectInfo.gradle.kts")

List<File> willCollectFiles = new ArrayList<File>()
File scriptDirectory = new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/gradle/script")
for (final def file in scriptDirectory.listFiles()) {
    if (file.name.endsWith(".java") || file.name.endsWith(".kt")) {
        willCollectFiles.add(file)
    }
}
File dataDirectory = new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/project/data")
File projectInfoSerializeFile = new File(dataDirectory, "JuggProjectInfoSerialize.kt")
for (final def file in dataDirectory.listFiles()) {
    if (file.name.endsWith(".java") || file.name.endsWith(".kt")) {
        willCollectFiles.add(file)
    }
}
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/project/JuggPathManager.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/project/dependency/DependencyDiffResult.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/compiler/manifest/XmlAndroidManifestInfo.kt"))
willCollectFiles.add(new File(projectDir, "src/main/java/com/sickworm/intellij/jugg/compiler/manifest/XmlParser.kt"))

def sortWeight = { File file ->
    String path = file.absolutePath.replace('\\', '/')
    if (path.endsWith('/project/JuggPathManager.kt')) {
        return 1
    }
    if (path.endsWith('/project/dependency/DependencyDiffResult.kt')) {
        return 2
    }
    if (path.endsWith('/compiler/manifest/XmlAndroidManifestInfo.kt')) {
        return 3
    }
    if (path.endsWith('/compiler/manifest/XmlParser.kt')) {
        return 4
    }
    if (path.endsWith('/gradle/script/ProjectInfoSerializerInGradle.kt')) {
        return 5
    }
    if (path.endsWith('/gradle/script/GradleDependencyDiffer.kt')) {
        return 7
    }
    if (path.endsWith('/gradle/script/GradleProjectInfoReaderManager.kt')) {
        return 8
    }
    if (path.contains('/gradle/script/')) {
        return 6
    }
    return 9
}

def readProjectInfoSerializeVersion = {
    String sourceText = projectInfoSerializeFile.text
    def versionMatch = (sourceText =~ /private\s+const\s+val\s+VERSION\s*=\s*(\d+)/)
    if (!versionMatch.find()) {
        throw new GradleException("Cannot parse JuggProjectInfoSerialize.VERSION from ${projectInfoSerializeFile}")
    }
    return versionMatch.group(1)
}

// sort order
willCollectFiles = willCollectFiles.sort { File left, File right ->
    int compareByWeight = sortWeight(left) <=> sortWeight(right)
    if (compareByWeight != 0) {
        return compareByWeight
    }
    return left.absolutePath <=> right.absolutePath
}

tasks.register('buildReadProjectInfoScript') {

    inputs.files willCollectFiles
    outputs.file readProjectInfoKtsFile

    doLast {
        readProjectInfoKtsFile.delete()
        readProjectInfoKtsFile.parentFile.mkdirs()

        // Collect imports, class bodies, and companion members from all source files.
        // Companion members must be extracted to top level because companion object blocks
        // cause compilation errors in .kts scripts (Gradle 7: wrong bytecode; Gradle 9: captures script instance).
        //
        // EXCEPTION: Classes that use Reflector() in instance methods must KEEP their companion object.
        // On Kotlin 1.5 (Gradle 7), removing the companion changes bytecode generation for the class,
        // causing NoSuchMethodError at runtime when constructing sibling inner classes (Reflector).
        Set<String> keepCompanionClasses = new HashSet<>(["GradleApplicationInjector", "GradleProjectInfoReaderManager", "Reflector"])

        List<String> companionMembers = new ArrayList<>()
        List<String> classContents = new ArrayList<>()
        Set<String> imports = new LinkedHashSet<>()

        willCollectFiles.forEach { File sourceFile ->
            List<String> lines = sourceFile.readLines()

            // Collect imports (skip jugg and gradle internal imports — already on classpath)
            lines.forEach { String line ->
                if (line.startsWith("import ")) {
                    String importClass = line.substring("import ".length()).trim()
                    if (!importClass.startsWith("com.sickworm.intellij.jugg") &&
                            !importClass.startsWith("org.gradle.api")) {
                        imports.add(importClass)
                    }
                }
            }

            // Extract companion object contents to top level using brace-depth tracking.
            // Classes in keepCompanionClasses retain their companion object as-is.
            // Also strips @JvmStatic from extracted members (not valid on top-level declarations).
            List<String> bodyLines = new ArrayList<>()
            boolean inCompanion = false
            boolean keepCompanion = false
            int companionDepth = 0
            String currentClass = ""
            int classDepth = 0  // brace depth relative to file root; currentClass only updated at depth 0

            lines.each { String line ->
                String trimmed = line.trim()

                // Skip file-level directives
                if (trimmed.startsWith("package ") || trimmed.startsWith("import ") ||
                        trimmed.startsWith("@file:Suppress")) {
                    return
                }

                // Track current top-level class name (only at depth 0 to avoid inner classes overwriting it)
                if (classDepth == 0) {
                    def classMatch = (trimmed =~ /^(?:data |sealed |abstract |open )?class (\w+)/)
                    if (classMatch.find()) {
                        currentClass = classMatch.group(1)
                    }
                }

                if (!inCompanion) {
                    if (trimmed.startsWith("companion object")) {
                        inCompanion = true
                        keepCompanion = keepCompanionClasses.contains(currentClass)
                        // Count braces on this line to get initial depth
                        companionDepth = trimmed.count("{") - trimmed.count("}")
                        if (companionDepth <= 0) inCompanion = false
                        if (keepCompanion) {
                            // Keep companion object wrapper line in class body
                            bodyLines.add(line)
                        }
                        // Update classDepth for non-companion braces on this line (already done above)
                        classDepth += trimmed.count("{") - trimmed.count("}")
                        return
                    }
                    // Remove 'private' from script-file-level declarations (outside all classes, classDepth == 0).
                    // In Kotlin 1.5 .kts scripts, private top-level vals/funs require 'access$' bridge methods
                    // that are not generated by Kotlin 1.5, causing NoSuchMethodError at runtime.
                    String processedLine = line
                    if (classDepth == 0 && (trimmed.startsWith("private val ") || trimmed.startsWith("private var ") || trimmed.startsWith("private fun "))) {
                        processedLine = line.replaceFirst("private ", "")
                    }
                    classDepth += trimmed.count("{") - trimmed.count("}")
                    bodyLines.add(processedLine)
                } else {
                    // Inside companion object: track brace depth
                    companionDepth += trimmed.count("{") - trimmed.count("}")

                    if (companionDepth <= 0) {
                        // Closing brace of companion object
                        inCompanion = false
                        classDepth += trimmed.count("{") - trimmed.count("}")
                        if (keepCompanion) {
                            bodyLines.add(line)
                        }
                        return
                    }

                    if (keepCompanion) {
                        // Keep companion contents inside the class body
                        bodyLines.add(line)
                        return
                    }

                    // Skip @JvmStatic — not valid on top-level declarations
                    if (trimmed.startsWith("@JvmStatic")) {
                        return
                    }

                    // Remove 'const' modifier: const val is not allowed at script top-level (Kotlin 1.5)
                    // Remove 'private' modifier: private top-level declarations are not allowed in Kotlin 1.5
                    // Qualify inner enum refs: 'Type.X' inside extracted companion members becomes unresolved at top-level
                    String memberLine = line
                        .replace("const val ", "val ")
                        .replaceAll("(?<![A-Za-z])private (fun |val |var )", "\$1")
                        // Qualify unqualified Type.X enum refs extracted from companion to top level.
                        // Use negative lookbehind to avoid double-qualifying already-prefixed ModuleInfo.Type.X.
                        .replaceAll("(?<!ModuleInfo\\.)Type\\.Application", "ModuleInfo.Type.Application")
                        .replaceAll("(?<!ModuleInfo\\.)Type\\.Library", "ModuleInfo.Type.Library")
                        .replaceAll("(?<!ModuleInfo\\.)Type\\.JavaLibrary", "ModuleInfo.Type.JavaLibrary")
                        .replaceAll("(?<!ModuleInfo\\.)Type\\.DynamicFeature", "ModuleInfo.Type.DynamicFeature")
                        .replaceAll("(?<!ModuleInfo\\.)Type\\.Unknown", "ModuleInfo.Type.Unknown")

                    // Rename conflicting createEmpty functions
                    if (trimmed.startsWith("fun createEmpty(") || trimmed.startsWith("fun createEmpty():")) {
                        if (currentClass == "DependencyDiffResultSet") {
                            memberLine = line.replace("fun createEmpty(", "fun dependencyDiffResultSetCreateEmpty(")
                        } else if (currentClass == "DependencyDiffResult") {
                            memberLine = line.replace("fun createEmpty(", "fun dependencyDiffResultCreateEmpty(")
                        }
                    }

                    companionMembers.add(memberLine)
                }
            }

            classContents.add(bodyLines.join("\n"))
            classContents.add("\n")
        }

        // Build script content: header → imports → companion members (top-level) → class bodies → entry point
        StringBuilder finalContent = new StringBuilder()
        finalContent.append("""// use to read variables in gradle environment
// usage: ./gradlew :app:assembleDebug -I readProjectInfo.gradle
""")
        imports.forEach {
            finalContent.append("import ")
            finalContent.append(it)
            finalContent.append("\n")
        }
        finalContent.append("\n")

        // Top-level companion members (extracted from companion objects)
        companionMembers.forEach {
            finalContent.append(it)
            finalContent.append("\n")
        }
        finalContent.append("\n")

        classContents.forEach {
            finalContent.append(it)
            finalContent.append("\n")
        }
        finalContent.append("\n")

        finalContent.append("""
gradle.allprojects {
    project.pluginManager.withPlugin("com.android.application") {
        gradleApplicationInjector(rootProject).injectApplication(project)
    }
}

gradle.rootProject {
    if (gradle.parent != null) {
        tasks.maybeCreate(GradleProjectInfoReaderManager.READ_PROJECT_INFO_TASK_NAME).apply {
            group = "jugg"
            description = "Writes Jugg project info for this included build"
        }
    }
}

gradle.projectsEvaluated {
    val projectInfoReaderManager = gradleProjectInfoReaderManager(rootProject, gradle.includedBuilds)
    projectInfoReaderManager.injectAndroidTestTaskIfNeeded()
    if (gradle.includedBuilds.isNotEmpty()) {
        projectInfoReaderManager.injectIncludedBuildProjectInfoTasks()
    }
}

gradle.taskGraph.whenReady {
    println("Jugg: task graph ready for \${rootProject.projectDir}")
    val isDryRun = gradle.startParameter.isDryRun
    var hasReadProjectInfo = false

    fun readProjectInfoOnce() {
        if (hasReadProjectInfo) {
            return
        }
        hasReadProjectInfo = true
        gradleProjectInfoReaderManager(rootProject, gradle.includedBuilds).readAndSave()
    }

    if (isDryRun) {
        readProjectInfoOnce()
    } else {
        val terminalTask = gradle.taskGraph.allTasks.lastOrNull()
        if (terminalTask == null) {
            println("Jugg: no terminal task found, read project info immediately")
            readProjectInfoOnce()
        } else {
            println("Jugg: readProjectInfo.gradle will execute after task \${terminalTask.path}")
            terminalTask.doLast {
                readProjectInfoOnce()
            }
        }
    }
}
""")
        finalContent.append("\n")

        String rawContent = finalContent.toString()
        String projectInfoSerializeVersion = readProjectInfoSerializeVersion()

        // Rewrite qualified companion member calls (e.g. DependencyDiffResult.create() -> create())
        // Must run before factory function injection to handle all call sites.
        String processedContent = rawContent
            .replace("DependencyDiffResultSet.createEmpty(", "dependencyDiffResultSetCreateEmpty(")
            .replace("DependencyDiffResult.createEmpty(",    "dependencyDiffResultCreateEmpty(")
            .replace("DependencyDiffResult.create(",         "create(")
            .replace("ProjectInfoSerializerInGradle.getJsonGenerator(", "getJsonGenerator(")
            .replace("JuggProjectInfoSerialize.serialize(",  "serialize(")
            .replace("JuggProjectInfoSerialize.deserialize(","deserialize(")
            .replace("XmlAndroidManifestInfo.parse(",        "parse(")
            .replace("ModuleInfo.virtualModule",             "virtualModule")
            .replace("ModuleInfo.DEFAULT_BUILD_VARIANT",     "DEFAULT_BUILD_VARIANT")
            .replace("SigningConfig.EMPTY",                  "EMPTY")
            // Inline VERSION constant in JuggProjectInfoSerialize secondary constructor delegate call.
            // The companion was extracted to top level; VERSION became a non-const val.
            // In Kotlin 1.5 .kts scripts, secondary constructors cannot access script-level non-const vals
            // (generates NoSuchMethodError). Using the literal value avoids the accessor issue.
            // Keep in sync with JuggProjectInfoSerialize.VERSION.
            .replace(") : this(juggProjectInfoExceptModules, dependencyList, modules, VERSION)",
                     ") : this(juggProjectInfoExceptModules, dependencyList, modules, ${projectInfoSerializeVersion})")

        // Problem B fix: replace direct inner-class construction calls with top-level factory function calls.
        // Must run BEFORE appending factory function definitions to avoid replacing them too.
        // Regex (?<!class )(?<![A-Za-z])ClassName( uses two lookbehinds:
        //   (?<!class ) — prevents replacing class/data class declarations (e.g. "class LibraryDependency(")
        //   (?<![A-Za-z]) — prevents replacing compound names (e.g. "UpdatedLibraryDependency(" → "LibraryDependency(" part)
        [
            'InitScriptManifestXmlHelper',
            'GradleProjectInfoReader',
            'GradleDependencyDiffer',
            'ProjectInfoSerializerInGradle',
            'JuggPathManager',
            'ModuleBuildPathInfo',
            'LibraryDependency',
            'GradleApplicationInjector',
            'GradleProjectInfoReaderManager',
        ].each { String className ->
            String factoryName = className[0].toLowerCase() + className.substring(1)
            processedContent = processedContent.replaceAll("(?<!class )(?<![A-Za-z])${className}\\(", "${factoryName}(")
        }

        // Append factory function definitions AFTER replacement so they are not themselves replaced
        processedContent += """
// Top-level factory functions: route inner-class construction through top-level scope to avoid
// Kotlin 1.5 (Gradle 7) NoSuchMethodError when constructing sibling inner classes from a lambda.
fun initScriptManifestXmlHelper(manifestFile: File) = InitScriptManifestXmlHelper(manifestFile)
fun gradleProjectInfoReader(rootProject: Project, lastProjectInfo: JuggProjectInfoSerialize?, ideProjectDir: File) = GradleProjectInfoReader(rootProject, lastProjectInfo, ideProjectDir)
fun gradleDependencyDiffer(rootProject: Project, projectInfo: JuggProjectInfo, ideProjectDir: File = rootProject.projectDir) = GradleDependencyDiffer(rootProject, projectInfo, ideProjectDir)
fun projectInfoSerializerInGradle(dataFile: File) = ProjectInfoSerializerInGradle(dataFile)
fun juggPathManager(projectDir: File) = JuggPathManager(projectDir)
fun moduleBuildPathInfo(projectRootDir: File, moduleRootDir: File, buildVariant: String, buildDirRelativePath: String) = ModuleBuildPathInfo(projectRootDir, moduleRootDir, buildVariant, buildDirRelativePath = buildDirRelativePath)
fun libraryDependency(name: String, file: File) = LibraryDependency(name, file)
fun libraryDependency(name: String, file: File, lastModifiedTime: Long, crc32: Long) = LibraryDependency(name, file, lastModifiedTime, crc32)
fun gradleApplicationInjector(rootProject: Project) = GradleApplicationInjector(rootProject)
fun gradleProjectInfoReaderManager(rootProject: Project, includedBuilds: Collection<IncludedBuild>) = GradleProjectInfoReaderManager(rootProject, includedBuilds)
"""

        // Compat with Kotlin 1.4 grammar: remove trailing "," in last arguments
        Pattern pattern = Pattern.compile(", *(//.*)?\\n *\\)(.*)")
        Matcher matcher = pattern.matcher(processedContent)
        String finalResult = matcher.replaceAll(")\$2 \$1")

        // write it!
        readProjectInfoKtsFile.write(finalResult)
    }
}
