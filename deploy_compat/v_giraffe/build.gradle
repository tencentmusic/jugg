plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java'
    id 'org.jetbrains.intellij'
}

intellij {
    version '223.7571.182' // Android Studio Giraffe
//    plugins 'android' // latest use jars in libs copied from Android Studio Canary instead of plugin
}

repositories {
    google()
    mavenCentral()

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation project(':deploy_compat:interface')
    api project(':deploy_compat:v_chipmunk')
}

test {
    useJUnitPlatform()
}